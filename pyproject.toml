[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yottaflex-api-ingestion"
version = "1.0.0"
description = "Reliable, restartable paginated API ingestion demo"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "requests>=2.31,<3", "pandas>=2.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
